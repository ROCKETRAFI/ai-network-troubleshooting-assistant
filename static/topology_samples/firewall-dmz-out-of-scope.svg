<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="100%" stop-color="#120808"/>
    </linearGradient>
    <pattern id="grid3" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#3a2020" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1480" height="900" fill="url(#bg3)"/>
  <rect width="1480" height="900" fill="url(#grid3)" opacity="0.35"/>

  <text x="36" y="36" fill="#fca5a5" font-family="Segoe UI, Arial" font-size="12" font-weight="700" letter-spacing="2.2">OUT OF SCOPE  |  SECURITY ZONES</text>
  <text x="36" y="68" fill="#fee2e2" font-family="Segoe UI, Arial" font-size="24" font-weight="800">Enterprise firewall, DMZ, and inside campus (no OSPF/BGP delta)</text>
  <text x="36" y="92" fill="#f87171" font-family="Segoe UI, Arial" font-size="13">Used in viva to show the copilot will refuse NAT, ACL, and zone-based firewall generation</text>

  <ellipse cx="740" cy="150" rx="120" ry="42" fill="#2a1515" stroke="#f87171" stroke-width="2"/>
  <text x="740" y="156" fill="#fecaca" text-anchor="middle" font-size="15" font-weight="700">Untrusted Internet</text>
  <line x1="740" y1="192" x2="740" y2="228" stroke="#f87171" stroke-width="2"/>

  <rect x="610" y="228" width="260" height="90" rx="10" fill="#3f1212" stroke="#ef4444" stroke-width="2.6"/>
  <text x="740" y="262" fill="#fff" text-anchor="middle" font-size="22" font-weight="800">FW1 / FW2 HA</text>
  <text x="740" y="284" fill="#fca5a5" text-anchor="middle" font-size="12">ZONE-BASED FIREWALL PAIR</text>
  <text x="740" y="302" fill="#f87171" text-anchor="middle" font-size="11">outside  |  dmz  |  inside</text>

  <line x1="660" y1="318" x2="220" y2="400" stroke="#fb7185" stroke-width="2"/>
  <line x1="740" y1="318" x2="740" y2="400" stroke="#fbbf24" stroke-width="2"/>
  <line x1="820" y1="318" x2="1260" y2="400" stroke="#34d399" stroke-width="2"/>

  <rect x="48" y="400" width="360" height="280" rx="14" fill="#2a1218" stroke="#fb7185" stroke-dasharray="6 4"/>
  <text x="228" y="432" fill="#fb7185" text-anchor="middle" font-size="15" font-weight="800">OUTSIDE ZONE</text>
  <rect x="88" y="456" width="280" height="56" rx="8" fill="#1a0c10" stroke="#fb7185"/>
  <text x="228" y="490" fill="#fecaca" text-anchor="middle" font-size="14">NAT PAT pool / ISP handoff</text>
  <rect x="88" y="528" width="130" height="70" rx="8" fill="#1a0c10" stroke="#fb7185"/>
  <text x="153" y="558" fill="#fecaca" text-anchor="middle" font-size="13" font-weight="700">VPN</text>
  <text x="153" y="578" fill="#f9a8d4" text-anchor="middle" font-size="11">IPsec peers</text>
  <rect x="238" y="528" width="130" height="70" rx="8" fill="#1a0c10" stroke="#fb7185"/>
  <text x="303" y="558" fill="#fecaca" text-anchor="middle" font-size="13" font-weight="700">ACL</text>
  <text x="303" y="578" fill="#f9a8d4" text-anchor="middle" font-size="11">deny any log</text>
  <text x="228" y="640" fill="#f9a8d4" text-anchor="middle" font-size="12">No OSPF/BGP here</text>

  <rect x="448" y="400" width="584" height="280" rx="14" fill="#2a2310" stroke="#fbbf24" stroke-dasharray="6 4"/>
  <text x="740" y="432" fill="#fbbf24" text-anchor="middle" font-size="15" font-weight="800">DMZ ZONE</text>
  <rect x="480" y="456" width="150" height="88" rx="8" fill="#1c1608" stroke="#fbbf24"/>
  <text x="555" y="492" fill="#fde68a" text-anchor="middle" font-size="16" font-weight="800">WEB</text>
  <text x="555" y="516" fill="#fcd34d" text-anchor="middle" font-size="12">tcp/443  tcp/80</text>
  <rect x="656" y="456" width="150" height="88" rx="8" fill="#1c1608" stroke="#fbbf24"/>
  <text x="731" y="492" fill="#fde68a" text-anchor="middle" font-size="16" font-weight="800">DNS</text>
  <text x="731" y="516" fill="#fcd34d" text-anchor="middle" font-size="12">udp/53</text>
  <rect x="832" y="456" width="150" height="88" rx="8" fill="#1c1608" stroke="#fbbf24"/>
  <text x="907" y="492" fill="#fde68a" text-anchor="middle" font-size="16" font-weight="800">MAIL</text>
  <text x="907" y="516" fill="#fcd34d" text-anchor="middle" font-size="12">tcp/25  tcp/587</text>
  <rect x="568" y="564" width="344" height="80" rx="8" fill="#1c1608" stroke="#fbbf24"/>
  <text x="740" y="598" fill="#fde68a" text-anchor="middle" font-size="14" font-weight="700">inspect http / inspect dns / inspect smtp</text>
  <text x="740" y="622" fill="#fcd34d" text-anchor="middle" font-size="12">jump host + reverse proxy</text>

  <rect x="1072" y="400" width="360" height="280" rx="14" fill="#10241c" stroke="#34d399" stroke-dasharray="6 4"/>
  <text x="1252" y="432" fill="#34d399" text-anchor="middle" font-size="15" font-weight="800">INSIDE ZONE</text>
  <rect x="1104" y="456" width="140" height="70" rx="8" fill="#0b1a14" stroke="#34d399"/>
  <text x="1174" y="486" fill="#a7f3d0" text-anchor="middle" font-size="14" font-weight="700">SW-IN</text>
  <text x="1174" y="508" fill="#6ee7b7" text-anchor="middle" font-size="11">ACCESS</text>
  <rect x="1264" y="456" width="140" height="70" rx="8" fill="#0b1a14" stroke="#34d399"/>
  <text x="1334" y="486" fill="#a7f3d0" text-anchor="middle" font-size="14" font-weight="700">AP-IN</text>
  <text x="1334" y="508" fill="#6ee7b7" text-anchor="middle" font-size="11">WLAN</text>
  <rect x="1104" y="544" width="90" height="48" rx="6" fill="#0b1a14" stroke="#34d399"/>
  <text x="1149" y="574" fill="#a7f3d0" text-anchor="middle" font-size="13">PC1</text>
  <rect x="1210" y="544" width="90" height="48" rx="6" fill="#0b1a14" stroke="#34d399"/>
  <text x="1255" y="574" fill="#a7f3d0" text-anchor="middle" font-size="13">PC2</text>
  <rect x="1316" y="544" width="90" height="48" rx="6" fill="#0b1a14" stroke="#34d399"/>
  <text x="1361" y="574" fill="#a7f3d0" text-anchor="middle" font-size="13">PC3</text>
  <text x="1252" y="640" fill="#6ee7b7" text-anchor="middle" font-size="12">RFC1918 10.10.10.0/24</text>

  <rect x="36" y="712" width="1408" height="70" rx="10" fill="#1c1010" stroke="#7f1d1d"/>
  <text x="740" y="742" fill="#fca5a5" text-anchor="middle" font-size="14">Inside looks like a campus, but policy lives on FW1. This MVP must not emit IOS for firewall, NAT, or ACL.</text>
  <text x="740" y="766" fill="#94a3b8" text-anchor="middle" font-size="12">Compare with the OSPF/BGP samples: those may suggest a routing change. This one must not.</text>

  <rect x="36" y="804" width="1408" height="68" rx="10" fill="#3f1212" stroke="#ef4444"/>
  <text x="740" y="832" fill="#fecaca" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="800">No suggested OSPF/BGP change - out of copilot scope</text>
  <text x="740" y="854" fill="#fca5a5" text-anchor="middle" font-size="13">Firewall, NAT, and ACL designs must not produce Cisco IOS or Ansible from this MVP</text>
</svg>
