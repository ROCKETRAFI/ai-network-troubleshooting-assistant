  <text x="36" y="36" fill="#5eead4" font-family="Segoe UI, Arial" font-size="12" font-weight="700" letter-spacing="2.2">NETWORK ASSISTANCE  |  ENTERPRISE CAMPUS</text>
  <text x="36" y="68" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="24" font-weight="800">Three-router OSPF core with collapsed campus edge</text>
  <text x="36" y="92" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="13">R1 core / R2 distribution / R3 access remain the L3 foundation. Access switches, WLAN, servers, and WAN expand the design.</text>

  <!-- WAN / Internet -->
